name: Mirror to all targets (with link rewrite)

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  mirror-all:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git setup & identity
        run: |
          git config --global user.name "mirror-bot"
          git config --global user.email "mirror-bot@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 524288000
          git config --global core.compression 0
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # ─── Step 1: GitHub ────────────────────────────────────
      - name: Rewrite Forgejo links to GitHub
        run: |
          git reset --hard "$BASE_SHA"
          sed -i 's#https://git\.kangel\.xyz/KangelPlugins/Plugins-Store/raw/branch/main/#https://raw.githubusercontent.com/Kangel-Plugins/Plugins-Store/main/#g' store.json
          git add store.json
          git commit -m "chore: rewrite Forgejo links to GitHub [mirror-bot]" || echo "GitHub: no changes"

      - name: Push to GitHub
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          GH_USER="$(printf '%s' "$GH_USER" | tr -d '\r\n' | xargs)"
          GH_TOKEN="$(printf '%s' "$GH_TOKEN" | tr -d '\r\n' | xargs)"
          git remote add github "https://${GH_USER}:${GH_TOKEN}@github.com/Kangel-Plugins/Plugins-Store.git" || git remote set-url github "https://${GH_USER}:${GH_TOKEN}@github.com/Kangel-Plugins/Plugins-Store.git"
          git push github HEAD:main --force
          git push github --tags --force

      # ─── Step 2: Codeberg ──────────────────────────────────
      - name: Rewrite Forgejo links to Codeberg
        run: |
          git reset --hard "$BASE_SHA"
          FILES="store.json AGENTS.md"
          for f in $FILES; do
            if [ -f "$f" ]; then
              sed -i \
                -e 's#https://git\.kangel\.xyz/KangelPlugins/Plugins-Store/raw/branch/main/#https://codeberg.org/Kangel/Plugins-Store/raw/branch/main/#g' \
                -e 's#git\.kangel\.xyz/KangelPlugins/Plugins-Store#codeberg.org/Kangel/Plugins-Store#g' \
                "$f"
            fi
          done
          git add -A
          git commit -m "chore: rewrite Forgejo links to Codeberg [mirror-bot]" || echo "Codeberg: no changes"

      - name: Push to Codeberg
        env:
          CB_USER: ${{ secrets.CODEBERG_USER }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          CB_USER="$(printf '%s' "$CB_USER" | tr -d '\r\n' | xargs)"
          CB_TOKEN="$(printf '%s' "$CB_TOKEN" | tr -d '\r\n' | xargs)"
          git remote add codeberg "https://${CB_USER}:${CB_TOKEN}@codeberg.org/Kangel/Plugins-Store.git" || git remote set-url codeberg "https://${CB_USER}:${CB_TOKEN}@codeberg.org/Kangel/Plugins-Store.git"
          if ! git push codeberg HEAD:main --force; then
            echo "Full push failed, attempting batch push for large/fresh repo..."
            TOTAL=$(git rev-list --count HEAD)
            STEP=300
            i=$STEP
            while [ "$i" -lt "$TOTAL" ]; do
              COMMIT=$(git rev-list --reverse HEAD | sed -n "${i}p")
              echo "Pushing checkpoint commit $i of $TOTAL ($COMMIT)..."
              git push codeberg "$COMMIT":refs/heads/main --force || true
              i=$((i + STEP))
            done
            git push codeberg HEAD:main --force
          fi
          git push codeberg --tags --force

      # ─── Step 3: GitVerse ──────────────────────────────────
      - name: Rewrite Forgejo links to GitVerse
        run: |
          git reset --hard "$BASE_SHA"
          FILES="store.json AGENTS.md"
          for f in $FILES; do
            if [ -f "$f" ]; then
              sed -i \
                -e 's#https://git\.kangel\.xyz/KangelPlugins/Plugins-Store/raw/branch/main/#https://gitverse.ru/api/repos/bigfishtheory/Plugins-Store/raw/branch/main/#g' \
                -e 's#git\.kangel\.xyz/KangelPlugins/Plugins-Store#gitverse.ru/bigfishtheory/Plugins-Store#g' \
                "$f"
            fi
          done
          git add -A
          git commit -m "chore: rewrite Forgejo links to GitVerse [mirror-bot]" || echo "GitVerse: no changes"

      - name: Push to GitVerse
        env:
          GV_USER: ${{ secrets.GITVERSE_USER }}
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          GV_USER="$(printf '%s' "$GV_USER" | tr -d '\r\n' | xargs)"
          GV_TOKEN="$(printf '%s' "$GV_TOKEN" | tr -d '\r\n' | xargs)"
          git remote add gitverse "https://${GV_USER}:${GV_TOKEN}@gitverse.ru/bigfishtheory/Plugins-Store.git" || git remote set-url gitverse "https://${GV_USER}:${GV_TOKEN}@gitverse.ru/bigfishtheory/Plugins-Store.git"
          if ! git push gitverse HEAD:main --force; then
            echo "Full push failed, attempting batch push for large/fresh repo..."
            TOTAL=$(git rev-list --count HEAD)
            STEP=300
            i=$STEP
            while [ "$i" -lt "$TOTAL" ]; do
              COMMIT=$(git rev-list --reverse HEAD | sed -n "${i}p")
              echo "Pushing checkpoint commit $i of $TOTAL ($COMMIT)..."
              git push gitverse "$COMMIT":refs/heads/main --force || true
              i=$((i + STEP))
            done
            git push gitverse HEAD:main --force
          fi
          git push gitverse --tags --force